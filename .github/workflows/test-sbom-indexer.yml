name: Test SBOM Indexer

on:
  pull_request:
    paths:
      # this must match the pin file that ".bin/bashbrew-buildkit-env-setup.sh" resolves for "docker/scout-sbom-indexer" (the tag is a wildcard on purpose, and the pathspec in the step below has to agree)
      - '.external-pins/docker/scout-sbom-indexer___*'
      # changes to the test itself are a smoke test (the pin is unchanged, so the script has nothing to compare it to and just scans it)
      - .github/workflows/test-sbom-indexer.sh
      - .github/workflows/test-sbom-indexer.yml

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

# cancel existing runs if user makes another push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: $/.github/workflows/.bashbrew
      - name: .github/workflows/test-sbom-indexer.sh
        run: |
          # the script tests the pin in this checkout (the PR merged into the base branch), so compare it to the pin on the base branch (if they are the same, it is just a smoke test)
          # "git grep" with an empty pattern is an easy way to read a file by wildcard from another revision (the tag in the filename is what the PR might change)
          # this assumes the name of the repo never changes, and fails if the base branch somehow has no such file
          old="$(git grep -h -e '' "origin/$GITHUB_BASE_REF" -- '.external-pins/docker/scout-sbom-indexer___*')"
          .github/workflows/test-sbom-indexer.sh "$old"
